careerlens:
  target: dev
  outputs:
    dev:
      type: mysql
      server: "{{ env_var('MYSQL_HOST', 'localhost') }}"
      port: "{{ env_var('MYSQL_PORT', '3306') | int }}"
      database: "{{ env_var('MYSQL_DB', 'careerlens') }}"
      username: "{{ env_var('MYSQL_USER', 'root') }}"
      password: "{{ env_var('MYSQL_PASSWORD', '') }}"
      schema: "{{ env_var('MYSQL_DB', 'careerlens') }}"
      threads: 2
