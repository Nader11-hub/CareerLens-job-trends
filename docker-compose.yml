version: "3.9"

# ---------------------------------------------------------------------------
# CareerLens Docker Compose
# Services: mysql | pipeline (one-shot) | scheduler | api | dashboard
# ---------------------------------------------------------------------------

x-common-env: &common-env
  MYSQL_USER: ${MYSQL_USER:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nader}
  MYSQL_DB: ${MYSQL_DB:-careerlens}
  MYSQL_HOST: mysql
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-nader}@mysql:3306/${MYSQL_DB:-careerlens}?charset=utf8mb4"
  PIPELINE_INTERVAL_MINUTES: ${PIPELINE_INTERVAL_MINUTES:-5}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-app-base: &app-base
  build: .
  env_file:
    - .env
  environment:
    <<: *common-env
  depends_on:
    mysql:
      condition: service_healthy
  restart: on-failure

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-nader}
      MYSQL_DATABASE: ${MYSQL_DB:-careerlens}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-nader}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── One-shot pipeline run (ingestion + transform + backfill) ───────────────
  pipeline:
    <<: *app-base
    environment:
      <<: *common-env
      API_BASE_URL: http://api:8000
    command: >
      python -m src.orchestration.runner --source remotive
    volumes:
      - ./data:/app/data:ro   # Kaggle fallback CSV (read-only)

  # ── Recurring scheduled pipeline (near-real-time, default every 5 min) ──────
  # NOTE: This is intentionally a short-interval batch pipeline, not streaming.
  # Job postings change on the order of hours; 5-min cycles keep the dashboard
  # visibly fresh during demos. Set PIPELINE_INTERVAL_MINUTES in .env to adjust.
  scheduler:
    <<: *app-base
    environment:
      <<: *common-env
      API_BASE_URL: http://api:8000
    command: >
      python -m src.orchestration.runner --source all --schedule-interval ${PIPELINE_INTERVAL_MINUTES:-5}
    volumes:
      - ./data:/app/data:ro
    profiles:
      - scheduled   # Only starts with: docker compose --profile scheduled up

  # ── FastAPI REST API ───────────────────────────────────────────────────────
  api:
    <<: *app-base
    command: >
      uvicorn src.serving.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Streamlit Dashboard ────────────────────────────────────────────────────
  dashboard:
    <<: *app-base
    environment:
      <<: *common-env
      API_BASE_URL: http://api:8000
    command: >
      streamlit run src/serving/dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
